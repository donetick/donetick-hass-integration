name: Validate

on:
  push: 
  pull_request:
  schedule:
    - cron: "0 0 * * 0" 
  workflow_dispatch:

jobs:
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module tests/test_user_card.mjs
        env:
          TZ: Europe/Brussels
      # Own process: the test replaces the customElements/HTMLElement/window globals.
      - run: node --experimental-default-type=module tests/test_frontend_startup.mjs
      - run: npm install --prefix "$RUNNER_TEMP/donetick-card-tests" --no-package-lock happy-dom@20.14.5
      - run: node --experimental-default-type=module tests/test_user_card_dom.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_editor.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_action_editor.mjs
        env:
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_completed_card.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_updates.mjs
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_row_errors.mjs
        timeout-minutes: 2
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_complete_as.mjs
        timeout-minutes: 2
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js
      - run: node --experimental-default-type=module tests/test_card_performer.mjs
        timeout-minutes: 2
        env:
          TZ: Europe/Brussels
          DOM_TEST_MODULE: ${{ runner.temp }}/donetick-card-tests/node_modules/happy-dom/lib/index.js

  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
