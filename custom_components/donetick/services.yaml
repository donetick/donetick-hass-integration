complete_task:
  name: Complete Task
  description: Complete a Donetick task with optional user attribution
  fields:
    completed_by_username:
      name: Completed by Donetick username
      description: Choose a current circle member by username. Use only one performer field (username, HA user or numeric ID).
      selector:
        select:
          options: []
          mode: dropdown
    completed_by_ha_user:
      name: Completed by HA user
      description: Credit the selected HA account's mapped Donetick user in this integration, even when automatic caller mapping is disabled. Do not combine with Completed By User ID.
      selector:
        select:
          options: []
          mode: dropdown
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      name: Task ID
      description: The ID of the task to complete
      required: false
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID who completed the task (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

create_task:
  name: Create Task
  description: Create a new Donetick task
  fields:
    name:
      name: Task Name
      description: The name of the task
      required: true
      selector:
        text:
    description:
      name: Description
      description: Task description (optional)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: Task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    created_by:
      name: Created By User ID
      description: The Donetick circle member who creates and is assigned the task (optional; defaults to the API token owner)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

update_task:
  name: Update Task
  description: Update an existing Donetick task. Archived tasks remain archived unless Force Unarchive is enabled.
  fields:
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      name: Task ID
      description: The ID of the task to update
      required: false
      selector:
        number:
          min: 1
          mode: box
    name:
      name: Task Name
      description: The new name of the task (optional)
      required: false
      selector:
        text:
    description:
      name: Description
      description: New task description (optional, empty string to clear)
      required: false
      selector:
        text:
          multiline: true
    due_date:
      name: Due Date
      description: New task due date in RFC3339 format (optional, e.g., 2025-07-28T18:00:00Z)
      required: false
      selector:
        text:
    repeat_schedule:
      name: Repeat schedule
      description: Leave fields unchecked to keep the current schedule. A repeating task needs a first Due Date. Changing the repeat time affects future custom occurrences; Due Date controls the current occurrence.
      collapsed: true
      fields:
        frequency_type:
          name: Repeats
          description: Match Donetick's repeat pattern. Custom patterns use the related controls below. Thing triggers must already be configured in Donetick.
          selector:
            select:
              mode: dropdown
              options:
                - {value: once, label: One-time task}
                - {value: daily, label: Daily}
                - {value: weekly, label: Weekly}
                - {value: monthly, label: Monthly}
                - {value: yearly, label: Yearly}
                - {value: adaptive, label: Adaptive}
                - {value: interval, label: "Custom: every X units"}
                - {value: days_of_the_week, label: "Custom: days of the week"}
                - {value: day_of_the_month, label: "Custom: day of selected months"}
                - {value: always, label: Always available}
                - {value: trigger, label: "Triggered by a Thing (existing trigger)"}
        frequency:
          name: Repeat every
          description: For custom intervals, repeat every this many units (for example 3 days).
          selector:
            number:
              min: 1
              max: 1000
              mode: box
        interval_unit:
          name: Interval unit
          description: For custom intervals only.
          selector:
            select:
              options: [hours, days, weeks, months, years]
              mode: dropdown
        weekdays:
          name: Days of the week
          description: For the custom days-of-the-week pattern, choose one or more weekdays.
          selector:
            select:
              multiple: true
              options:
                - {value: monday, label: Monday}
                - {value: tuesday, label: Tuesday}
                - {value: wednesday, label: Wednesday}
                - {value: thursday, label: Thursday}
                - {value: friday, label: Friday}
                - {value: saturday, label: Saturday}
                - {value: sunday, label: Sunday}
        week_pattern:
          name: Weekday pattern
          description: Repeat every week, or choose the nth occurrence of each selected weekday within a month.
          selector:
            select:
              options:
                - {value: every_week, label: Every week}
                - {value: week_of_month, label: Nth weekday of the month}
              mode: dropdown
        occurrences:
          name: Weekday occurrences
          description: For the nth-weekday pattern, choose first, second, third, fourth, or last. Last uses -1 in YAML, matching Donetick.
          selector:
            select:
              multiple: true
              options:
                - {value: "1", label: First}
                - {value: "2", label: Second}
                - {value: "3", label: Third}
                - {value: "4", label: Fourth}
                - {value: "-1", label: Last}
        months:
          name: Months of the year
          description: For the custom day-of-selected-months pattern, choose one or more months.
          selector:
            select:
              multiple: true
              options:
                - {value: january, label: January}
                - {value: february, label: February}
                - {value: march, label: March}
                - {value: april, label: April}
                - {value: may, label: May}
                - {value: june, label: June}
                - {value: july, label: July}
                - {value: august, label: August}
                - {value: september, label: September}
                - {value: october, label: October}
                - {value: november, label: November}
                - {value: december, label: December}
        day_of_month:
          name: Day of the month
          description: For the custom day-of-selected-months pattern, repeat on this date (1–31).
          selector:
            number:
              min: 1
              max: 31
              mode: box
        schedule_time:
          name: Custom repeat time
          description: Time of day in Donetick's default timezone (UTC) for custom intervals, weekdays, or selected months. Use Due Date to change the time of the current occurrence or a standard daily, weekly, monthly, or yearly schedule.
          selector:
            time:
        schedule_from:
          name: Reschedule from
          description: Schedule the next occurrence from the previous due date or from when the task is completed, matching Donetick's scheduling preferences.
          selector:
            select:
              options:
                - {value: due_date, label: Due date}
                - {value: completion, label: Completion date}
              mode: dropdown
    force_unarchive:
      name: Force Unarchive
      description: Reactivate this task if it is archived (optional; defaults to false)
      required: false
      default: false
      selector:
        boolean:
    assigned_to_username:
      name: Assignee username
      description: Reassign to a current circle member by Donetick username. Use either this field or Assignee User ID.
      selector:
        select:
          options: []
          mode: dropdown
    assigned_to:
      name: Assignee User ID
      description: Assign to an eligible Donetick user ID, or use null in YAML for Anyone. Switching to or from Anyone requires task edit permission.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

skip_task:
  name: Skip Task
  description: Skip a recurring task, advancing to the next scheduled occurrence without recording a completion
  fields:
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      name: Task ID
      description: The ID of the task to skip
      required: false
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed By User ID
      description: The Donetick user ID to attribute the skip to (optional)
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

delete_task:
  name: Delete Task
  description: Delete a Donetick task
  fields:
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      name: Task ID
      description: The ID of the task to delete
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:

complete_assigned_task:
  name: Complete as assigned user
  description: Complete a task using an explicit performer, optional HA user mapping, or its current assignee. Without an override, Anyone tasks credit the API token owner.
  fields:
    completed_by_username:
      name: Completed by Donetick username
      description: Choose a current circle member by username. Use only one performer field (username, HA user or numeric ID).
      selector:
        select:
          options: []
          mode: dropdown
    completed_by_ha_user:
      name: Completed by HA user
      description: Credit the selected HA account's mapped Donetick user in this integration, even when automatic caller mapping is disabled. Do not combine with Completed by Donetick user.
      selector:
        select:
          options: []
          mode: dropdown
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      required: false
      selector:
        number:
          min: 1
          mode: box
    completed_by:
      name: Completed by Donetick user
      description: >-
        Credit the completion to this Donetick user, overriding optional HA
        user mapping and the current assignee. Donetick applies its own completion rules, which
        depend on the task's privacy, its assignment and its project, and
        rejects anyone it does not accept; the action then fails, carrying
        Donetick's own reason where it gives one.
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:
postpone_task:
  name: Reschedule task
  description: Use Donetick's scheduler to skip to the next occurrence without completing the task.
  fields:
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      required: false
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      selector:
        text:

delete_history:
  name: Delete History Entry
  description: Delete one history entry of a Donetick task, e.g. to undo a completion. Use with the history_id returned by complete_task; restore the previous due date with update_task.
  fields:
    task:
      name: Task
      description: Search active tasks by name, assignee, project ID or task ID. The selection includes its integration. Use either Task or Task ID.
      selector:
        select:
          options: []
          mode: dropdown
    task_id:
      name: Task ID
      description: The ID of the task the history entry belongs to
      required: false
      selector:
        number:
          min: 1
          mode: box
    history_id:
      name: History Entry ID
      description: The ID of the history entry to delete
      required: true
      selector:
        number:
          min: 1
          mode: box
    config_entry_id:
      name: Config Entry ID
      description: The specific Donetick integration to use (optional, uses first if not specified)
      required: false
      selector:
        text:
