[project]
name = "donetick-hass-integration"
version = "2.0.1"
description = "Home Assistant integration for Donetick"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
